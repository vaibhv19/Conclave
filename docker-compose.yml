services:
  postgres:
    image: postgres:16-alpine
    container_name: conclave-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: conclave_db
      POSTGRES_USER: conclave_user
      POSTGRES_PASSWORD: conclave_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
