spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/conclave_db}
    username: ${DB_USER:conclave_user}
    password: ${DB_PASSWORD:conclave_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3

